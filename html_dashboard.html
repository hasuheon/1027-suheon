regionNames.forEach(([code,name])=>region.add(new Option(name,code))); region.value=regionNames[0]?.[0]||'';
const recentLabel=r=>r['기간']==='최근 7일';
function calcRegion(code,prod){const rr=DATA.region.filter(r=>r['시도코드']===code&&r['제품코드']===prod);return {recent:avg(rr.filter(recentLabel)),previous:avg(rr.filter(r=>!recentLabel(r)))};}
 function svgTrend(code,prod){const rr=DATA.region.filter(r=>r['시도코드']===code&&r['제품코드']===prod).sort((a,b)=>a['날짜'].localeCompare(b['날짜'])); if(!rr.length)return '<div class="muted">자료 없음</div>'; const w=650,h=290,p={l:48,r:18,t:18,b:38}; const vals=rr.map(r=>r['평균가격 (원/리터)']);const min=Math.min(...vals),max=Math.max(...vals),span=max-min||1;const x=i=>p.l+i*(w-p.l-p.r)/Math.max(rr.length-1,1),y=v=>p.t+(max-v)*(h-p.t-p.b)/span;let lines=[0,1,2,3,4].map(i=>{const v=min+(span*i/4);return `<line class="gridline" x1="${p.l}" x2="${w-p.r}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${p.l-8}" y="${y(v)+4}" text-anchor="end">${Math.round(v).toLocaleString()}</text>`}).join('');let path=rr.map((r,i)=>{const v=r['평균가격 (원/리터)'];return (i?'L':'M')+x(i)+' '+y(v);}).join(' ');let dots=rr.map((r,i)=>`<circle class="dot" cx="${x(i)}" cy="${y(r['평균가격 (원/리터)'])}" r="4"><title>${r['날짜']} · ${fmt(r['평균가격 (원/리터)'])}원/리터</title></circle>`).join('');let labels=rr.map((r,i)=>`<text class="axis" x="${x(i)}" y="${h-12}" text-anchor="middle">${r['날짜'].slice(5)}</text>`).join('');return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="선택 지역의 일별 가격 추이"><title>선택 지역 일별 가격 추이</title>${lines}<path class="line" d="${path}"/>${dots}${labels}<text class="axis" x="${p.l}" y="12">원/리터</text></svg>`}
function svgBars(prod,selected){const vals=regionNames.map(([code,name])=>({code,name,v:calcRegion(code,prod).recent})).filter(x=>x.v!=null).sort((a,b)=>b.v-a.v);if(!vals.length)return '<div class="muted">7일치 자료가 있는 지역이 없습니다.</div>';const w=520,h=290,p={l:42,r:10,t:15,b:55},max=Math.max(...vals.map(x=>x.v)),bw=(w-p.l-p.r)/vals.length*.66;let bars=vals.map((x,i)=>{const xx=p.l+(i+.17)*(w-p.l-p.r)/vals.length, yy=p.t+(max-x.v)*(h-p.t-p.b)/max, hh=h-p.b-yy;return `<rect class="bar ${x.code===selected?'selected':''}" x="${xx}" y="${yy}" width="${bw}" height="${hh}" rx="3"><title>${esc(x.name)} · ${fmt(x.v)}원/리터</title></rect><text class="bar-label" transform="translate(${xx+bw/2},${h-20}) rotate(-45)" text-anchor="end">${esc(x.name)}</text>`}).join('');return `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="시도별 최근 7일 평균 가격"><title>시도별 최근 7일 평균</title><line class="gridline" x1="${p.l}" x2="${w-p.r}" y1="${h-p.b}" y2="${h-p.b}"/><text class="axis" x="${p.l-8}" y="${p.t+4}" text-anchor="end">${Math.round(max).toLocaleString()}</text>${bars}</svg>`}
function render(){const prod=product.value,code=region.value,n=calcRegion(code,prod),change=n.recent!=null&&n.previous!=null?n.recent-n.previous:null,rate=change!=null?change/n.previous:null;document.getElementById('recentAvg').textContent=fmt(n.recent);document.getElementById('previousAvg').textContent=fmt(n.previous);const ch=document.getElementById('change');ch.textContent=change==null?'–':(change>=0?'+':'')+fmt(change);ch.className='delta '+(change>0?'up':change<0?'down':'neutral');const rt=document.getElementById('rate');rt.textContent=pct(rate);rt.className='delta '+(rate>0?'up':rate<0?'down':'neutral');document.getElementById('coverage').textContent='최근 7일·직전 7일 각각 7일 충족 시 계산';document.getElementById('trendTitle').textContent=`${region.options[region.selectedIndex]?.text||''} · ${product.options[product.selectedIndex]?.text||''} 일별 가격`;document.getElementById('trend').innerHTML=svgTrend(code,prod);document.getElementById('bars').innerHTML=svgBars(prod,code);document.getElementById('regionTable').innerHTML=regionNames.map(([ac,name])=>{const x=calcRegion(ac,prod),d=x.recent!=null&&x.previous!=null?x.recent-x.previous:null,r=d!=null?d/x.previous:null;return `<tr><td>${esc(name)}</td><td class="num">${fmt(x.recent)}</td><td class="num">${fmt(x.previous)}</td><td class="num ${d>0?'up':d<0?'down':''}">${d==null?'–':(d>=0?'+':'')+fmt(d)}</td><td class="num ${r>0?'up':r<0?'down':''}">${pct(r)}</td></tr>`}).join('');}
product.addEventListener('change',render);region.addEventListener('change',render);document.getElementById('sourceLine').textContent=`기준일 ${DATA.source.match(/opinet[\\/]([^\\/]+)[\\/]유가/)?.[1]||''} · 오피넷 엑셀 원자료 기반`;document.getElementById('footer').textContent='계산 기준: 각 지역·유종의 일별 평균가격 7개를 산술평균. 단위: 원/리터. 원자료: 유가_기간비교.xlsx';render();
</script></body></html>
